<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#191411" />
    <meta
      name="description"
      content="Amalaya · Board de control del polígono de actuación concertada en el centro de Hermosillo."
    />
    <link rel="icon" type="image/svg+xml" href="/amalaya-board/sello.svg" />
    <link rel="manifest" href="/amalaya-board/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/amalaya-board/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
    <title>Amalaya · Board</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- La Chinche de YOD (pendientes que Claude revisa). Solo aparece para quien la
         encienda UNA vez con ?chinche=1 (se apaga con ?chinche=0): los visitantes de
         Amalaya no la ven y no hay ningún enlace a YOD OS. Los encargos van como issue
         a yodesarrollo/amalaya-board. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get('chinche');
          if (q === '1') localStorage.setItem('yod_chinche_on', '1');
          if (q === '0') localStorage.removeItem('yod_chinche_on');
          if (localStorage.getItem('yod_chinche_on') !== '1') return;
        } catch (e) { return; }
        var s = document.createElement('script');
        s.src = 'https://yodesarrollomx.github.io/yod-portal/chinche.js?v=org1';
        s.onload = function () { if (window.YODChinche) YODChinche.init({ pantalla: 'amalaya', repo: 'amalaya-board', org: 'yodesarrollo' }); };
        document.head.appendChild(s);
      })();
    </script>
  </body>
</html>
