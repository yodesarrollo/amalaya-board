<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Georgia, serif">
  <!-- Plano PROVISIONAL del polígono (supuesto — editable):
       se reemplaza por el plano real en cuanto Alejandro lo entregue. -->
  <rect width="1600" height="1000" fill="#221B15"/>
  <g stroke="#3A2F26" stroke-width="1">
    <path d="M200 0 V1000 M400 0 V1000 M600 0 V1000 M800 0 V1000 M1000 0 V1000 M1200 0 V1000 M1400 0 V1000"/>
    <path d="M0 200 H1600 M0 400 H1600 M0 600 H1600 M0 800 H1600"/>
  </g>
  <!-- Trazo esquemático del polígono -->
  <path d="M240 180 L1360 140 L1430 760 L1050 880 L300 830 Z"
        fill="none" stroke="#C9A45C" stroke-width="3" stroke-dasharray="14 10" opacity="0.8"/>
  <g stroke="#5A4A3A" stroke-width="2" opacity="0.7">
    <path d="M240 180 L300 830 M700 160 L740 850 M1100 148 L1160 862 M255 420 L1395 395 M275 640 L1420 620"/>
  </g>
  <text x="800" y="480" text-anchor="middle" fill="#B7A890" font-size="40">Plano provisional del polígono</text>
  <text x="800" y="530" text-anchor="middle" fill="#9E8D78" font-size="26">supuesto — editable · se cambia por el plano real sin mover las zonas</text>
</svg>
