togrametria): comercio de 1 piso = 4.5 m; equipamiento/nave de 1 piso = 5.0 m; banco o institucional de 2 pisos = 8.0 m; lote sin construir = 0.0 m. Todas quedan en confianza media o baja.", "DUPLICADOS Y FUERA DE CUADRO ELIMINADOS: el Instituto Sonorense de Cultura solo rozaba una esquina del cuadro y se retiro; los dos arreglos de paneles solares del reporte de mobiliario (y = -95 y y = -105) caen fuera de |y|<=70 y se retiraron; el 'lote_amalaya_este' se sustituyo por los 6 predios foro-predio para no duplicar la misma superficie.", "LOS 6 PREDIOS DEL FORO son una subdivision 2x3 regular del lote abierto de la esquina noreste (x 46 a 70, y 15 a 70 dentro del cuadro), con frente supuesto a Felix Tonela. Los linderos reales NO son visibles en la ortofoto ni existen en OSM: la particion es representativa, no catastral, y las areas no suman los 2,211 m2 porque el conjunto se extiende al este y al norte fuera del cuadro.", "Discrepancia no resuelta: en osm_esquina.json la calle Chihuahua corre en y aproximadamente -75, es decir al SUR del cuadro, mientras que el Foro se describe en la esquina noreste con frente a Felix Tonela; Felix Tonela no aparece en el extracto OSM. El frente de calle de los 6 predios queda como supuesto.", "Los colores de techo se leyeron directamente de la imagen; los colores de fachada son inferencias (tipologia o identidad de marca, caso Oxxo) porque la vista cenital no muestra fachadas.", "No se distinguen rayados peatonales, postes, luminarias, bancas, bolardos ni toldos a 0.261 m/px: las 4 esquinas se reportan como cruces por geometria, no por marca pintada. Se asume alumbrado publico tipico sin poder ubicarlo.", "Las especies de arbol son probables, no confirmadas; las alturas de arbolado se derivan del diametro de copa (copa ~5 m = altura 6.5 m), no de sombra medida.", "Los poligonos de area verde son manchas de vegetacion aproximadas; la franja verde del noreste se recorto a x 50-70 / y 52-68 para no traslapar la nave norte ni la calle." const joy=document.getElementById('joy'), nub=joy.querySelector('b'); let jv={x:0,y:0};
joy.addEventListener('pointerdown',e=>{joy.setPointerCapture(e.pointerId); mueveJoy(e)}); joy.addEventListener('pointermove',e=>{ if(e.buttons) mueveJoy(e)}); joy.addEventListener('pointerup',()=>{jv={x:0,y:0}; nub.style.left='40px'; nub.style.top='40px'});
function mueveJoy(e){ const r=joy.getBoundingClientRect(); let x=(e.clientX-r.left-60)/50, y=(e.clientY-r.top-60)/50; const l=Math.hypot(x,y); if(l>1){x/=l;y/=l} jv={x,y}; nub.style.left=(40+x*40)+'px'; nub.style.top=(40+y*40)+'px' }
document.getElementById('bVuelo').onclick=function(){ vuelo=!vuelo; this.classList.toggle('on',vuelo); if(vuelo){ pos.set(-40,55,60); pitch=-0.75; yaw=Math.PI*0.78 } else { pos.set(-8,1.65,8); pitch=-0.05 } };
let verEtq=true; document.getElementById('bEtq').onclick=function(){ verEtq=!verEtq; this.classList.toggle('on',verEtq) };
document.getElementById('bOrto').onclick=function(){ const on=!!matP.map; if(on){ matP.map=null; matP.color.set('#bdb6aa') } else if(ORTO){ new THREE.TextureLoader().load('data:image/jpeg;base64,'+ORTO,(t)=>{t.colorSpace=THREE.SRGBColorSpace; matP.map=t; matP.color.set('#ffffff'); matP.needsUpdate=true}) } matP.needsUpdate=true; this.classList.toggle('on',!on) };
document.getElementById('bSol').onclick=function(){ tarde=!tarde; this.classList.toggle('on',tarde); ponSol() };
// etiquetas DOM
const capaEtq=document.createElement('div'); document.body.appendChild(capaEtq);
const nodos=etiquetas.map(e=>{ const d=document.createElement('div'); d.className='etq'; d.innerHTML=`${e.titulo}<small>${e.sub||''}</small>`; capaEtq.appendChild(d); return d });
function ajustar(){ const w=innerWidth,h=innerHeight; ren.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix() } addEventListener('resize',ajustar); ajustar();
let t0=performance.now();
function frame(t){ const dt=Math.min((t-t0)/1000,0.05); t0=t;
  const v=(teclas.ShiftLeft||teclas.ShiftRight)?9:4; const dir=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)); const der=new THREE.Vector3(dir.z,0,-dir.x);
  let ax=0,az=0; if(teclas.KeyW||teclas.ArrowUp) az+=1; if(teclas.KeyS||teclas.ArrowDown) az-=1; if(teclas.KeyA||teclas.ArrowLeft) ax-=1; if(teclas.KeyD||teclas.ArrowRight) ax+=1; az+=-jv.y; ax+=jv.x;
  pos.addScaledVector(dir,-az*v*dt).addScaledVector(der,-ax*v*dt);
  if(vuelo){ if(teclas.KeyQ) pos.y-=v*dt; if(teclas.KeyE) pos.y+=v*dt; pos.y=Math.max(3,pos.y) } else pos.y=1.65;
  pos.x=Math.max(-R+2,Math.min(R-2,pos.x)); pos.z=Math.max(-R+2,Math.min(R-2,pos.z));
  cam.position.copy(pos); cam.rotation.set(0,0,0,'YXZ'); cam.rotation.y=yaw; cam.rotation.x=pitch;
  ren.render(esc,cam);
  const vp=new THREE.Vector3(); etiquetas.forEach((e,i)=>{ const n=nodos[i]; if(!verEtq){n.style.display='none';return} vp.copy(e.p).project(cam); const d=cam.position.distanceTo(e.p); if(vp.z>1||d>140){n.style.display='none';return} n.style.display='block'; n.style.left=((vp.x+1)/2*innerWidth)+'px'; n.style.top=((1-vp.y)/2*innerHeight)+'px'; n.style.opacity=d>90?0.5:1 });
  requestAnimationFrame(frame) }
requestAnimationFrame(frame);
</script></body></html>
