name: Publicar en GitHub Pages

# Cada push a main construye y publica el board.
# estado.json queda fuera: los latidos del guardián no queman builds.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'public/estado.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Pruebas (motor financiero + premisa de la careta)
        run: npm run pruebas
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
