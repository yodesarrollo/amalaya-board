name: Guardián de salud

# Cada 10 minutos pregunta "¿estás vivo?" al backend y al sitio.
# Escribe public/estado.json SOLO con metadatos (nunca datos del negocio)
# y solo commitea si el estado cambió — el historial cuenta las caídas
# sin ruido. El commit lleva [skip ci]: un latido no dispara deploys.
#
# Nota: el cron de GitHub es "mejor esfuerzo" (puede tardar 5-15 min extra)
# y se pausa si el repo pasa 60 días sin actividad.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: salud
  cancel-in-progress: false

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Revisar backend y sitio
        run: python scripts/verificar_salud.py
      - name: Publicar el estado si cambió
        run: |
          git config user.name "guardian-amalaya"
          git config user.email "actions@users.noreply.github.com"
          git add public/estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
          else
            git commit -m "guardián: estado $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"
            for intento in 1 2 3; do
              git push && break
              git fetch origin main && git rebase origin/main || git rebase --abort
              sleep $((intento * 3))
            done
          fi
